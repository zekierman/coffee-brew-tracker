services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: brewlog
      POSTGRES_PASSWORD: brewlog
      POSTGRES_DB: brewlog
    ports:
      # 5432 host'ta native PostgreSQL, 5433 baska bir projede kullaniliyor.
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
